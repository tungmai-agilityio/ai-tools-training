name: Claude

# Two jobs: `review` runs on every non-draft pull request (replacing the old security.yml), and `assistant`
# answers @claude mentions on comments and reviews. Answer-only: it cannot edit files or push; do fixes locally.
# Only owners, members and collaborators can start the assistant job. Issue bodies no longer trigger it; comment instead.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  review:
    # fork PRs get no secrets; a skipped review is better than a failing advisory run
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Do a security-focused review of this pull request. Follow `REVIEW.md`: run the Security
            pass first, then note Bugs and Compliance findings, checking against `CLAUDE.md`,
            `docs/references/code-conventions.md` and `docs/business-rules.md`.

            Report in the `REVIEW.md` Findings Format. Use inline comments for specific lines and one
            summary comment for everything else. Do not change code, commit or push.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  assistant:
    if: |
      github.event_name != 'pull_request' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-latest
    continue-on-error: true # an answer-only job must not fail the run, e.g. when the subscription usage limit is hit
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh run view:*)"
            --disallowedTools "Edit,Write,WebFetch,WebSearch,Bash(git push:*)"
