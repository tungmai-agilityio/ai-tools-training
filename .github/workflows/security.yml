name: Claude Security Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened] # add `synchronize` to re-review on every push

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # review only: it cannot push to the PR branch
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Do a security-focused review of this pull request. Follow `REVIEW.md`: run the Security
            pass first, then note Bugs and Compliance findings, checking against `CLAUDE.md`,
            `docs/references/code-conventions.md` and `docs/business-rules.md`.

            Report in the `REVIEW.md` Findings Format. Use inline comments for specific lines and one
            summary comment for everything else. Do not change code, commit or push.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
