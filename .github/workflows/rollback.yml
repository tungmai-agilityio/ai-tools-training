name: Rollback

# Restores an earlier commit by redeploying it through the Render hook; it does not revert git history.
# Runs from develop so the tooling is reviewed code. The production path targets `production-rollback`, which has
# no required reviewer: a rollback is the faster path (decided 2026-10-29) and the summary records who ran it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to roll back
        required: true
        type: choice
        default: staging
        options: [staging, production]
      ref:
        description: Earlier tag or commit that was deployed successfully
        required: true
        type: string

permissions:
  contents: read

# its own queue: sharing deploy-production would let a later dispatch cancel a pending rollback (or a deploy awaiting approval)
concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      # production needs the no-reviewer `production-rollback`; staging has no reviewer either (T-036 AC-7)
      name: ${{ inputs.environment == 'production' && 'production-rollback' || 'staging' }}
      url: ${{ vars.APP_URL }}
    timeout-minutes: 30

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop  # the rollback tooling is the default branch's reviewed code, never the restored commit
          fetch-depth: 0  # the guard resolves the input ref and checks it is on the target branch
          persist-credentials: false

      - name: Resolve the ref and check it is on the target branch
        id: target
        env:
          REF: ${{ inputs.ref }}
          BRANCH: ${{ inputs.environment == 'production' && 'main' || 'develop' }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          sha=$(bash scripts/check_release_ref.sh "$REF" "$BRANCH")
          # production has no approver, so only an earlier commit than the live one may be restored (never new main code)
          if [ "$BRANCH" = main ]; then
            live=$(curl -fsS --max-time 15 "${APP_URL%/}/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")')
            git merge-base --is-ancestor "$sha" "$live" 2>/dev/null || { echo "ref $sha is not an ancestor of the live commit '$live'; use Deploy Production for new code" >&2; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Trigger the rollback and verify it
        env:
          APP_URL: ${{ vars.APP_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
          ACTOR: ${{ github.actor }}
          DEPLOY_LABEL: Rollback (${{ inputs.environment }})
          SUMMARY_HINT: Redeploy manually in Render from the Events tab if this failed, then revert the bad commit in a PR.
          TIMEOUT_SECONDS: "1200"
        run: python3 scripts/deploy_production.py

      # the step summary is not published when the job is cancelled, so a red run must still explain itself
      - name: Note a missing summary
        if: always()
        run: |
          [ -s "$GITHUB_STEP_SUMMARY" ] || echo "The rollback script wrote no summary; see the log above." >> "$GITHUB_STEP_SUMMARY"
