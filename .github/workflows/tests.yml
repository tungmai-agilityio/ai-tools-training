
name: Tests

# Docs and planning files cannot change a test result, so a change to only these files skips the run.
# Hooks (.claude/), workflows, scripts/, requirements and render.yaml still run it.
on:
  pull_request:
    branches: [develop]
    paths-ignore: ["**.md", "docs/**", "plans/**", ".github/ISSUE_TEMPLATE/**"]
  push:
    branches: [develop]
    paths-ignore: ["**.md", "docs/**", "plans/**", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      REQUIRE_BROWSER: "1"
      AUTH_SECRET: ci-throwaway-secret-not-real-0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: playwright install chromium

      # The apt mirror once stalled this step for 643s of an 11m33s run (the other runs took ~25s), so cap each
      # attempt and retry once instead of waiting it out.
      - name: Install Chromium system dependencies
        timeout-minutes: 6
        run: |
          for attempt in 1 2; do
            timeout 150 playwright install-deps chromium && exit 0
          done
          exit 1

      - name: Run tests
        run: pytest -q

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test-artifacts/screenshots/
          retention-days: 14
          if-no-files-found: ignore
